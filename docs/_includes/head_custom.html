<!-- Visor de diagramas Mermaid: botón «Ampliar» y pantalla completa con zoom y arrastre. -->
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js" defer></script>
<style>
  .mmd-wrap { position: relative; padding-top: 2.4rem !important; }
  .mmd-btn {
    position: absolute; top: .5rem; right: .5rem; z-index: 2;
    font: .75rem/1.2 system-ui, -apple-system, sans-serif; padding: .3rem .7rem; cursor: pointer;
    border: 1px solid #d0d7de; border-radius: 4px; background: #fff; color: #24292f;
    opacity: .85;
  }
  .mmd-btn:hover { opacity: 1; }
  .mmd-overlay {
    position: fixed; inset: 0; z-index: 1000; background: #fff;
    display: flex; flex-direction: column;
  }
  .mmd-bar {
    display: flex; gap: .5rem; justify-content: flex-end; align-items: center;
    padding: .5rem .75rem; border-bottom: 1px solid #d0d7de; font: .8rem system-ui, -apple-system, sans-serif; color: #57606a;
  }
  .mmd-bar span { margin-right: auto; }
  .mmd-bar button {
    font-size: .8rem; padding: .25rem .6rem; cursor: pointer;
    border: 1px solid #d0d7de; border-radius: 4px; background: #fff;
  }
  .mmd-stage { flex: 1; min-height: 0; }
  .mmd-stage svg { width: 100%; height: 100%; max-width: none !important; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    function abrir(svgOriginal) {
      var overlay = document.createElement("div");
      overlay.className = "mmd-overlay";
      overlay.innerHTML =
        '<div class="mmd-bar"><span>Rueda o pellizco para acercar · arrastra para mover · Esc para cerrar</span>' +
        '<button data-a="in">+</button><button data-a="out">−</button>' +
        '<button data-a="fit">Ajustar</button><button data-a="close">Cerrar</button></div>' +
        '<div class="mmd-stage"></div>';
      var svg = svgOriginal.cloneNode(true);
      svg.removeAttribute("style");
      svg.removeAttribute("width");
      svg.removeAttribute("height");
      overlay.querySelector(".mmd-stage").appendChild(svg);
      document.body.appendChild(overlay);
      document.body.style.overflow = "hidden";

      var pz = window.svgPanZoom
        ? svgPanZoom(svg, { zoomScaleSensitivity: 0.3, minZoom: 0.2, maxZoom: 20, fit: true, center: true })
        : null;

      function cerrar() {
        if (pz) pz.destroy();
        overlay.remove();
        document.body.style.overflow = "";
        document.removeEventListener("keydown", tecla);
      }
      function tecla(e) { if (e.key === "Escape") cerrar(); }
      document.addEventListener("keydown", tecla);

      overlay.querySelector(".mmd-bar").addEventListener("click", function (e) {
        var a = e.target.getAttribute("data-a");
        if (a === "close") cerrar();
        if (!pz) return;
        if (a === "in") pz.zoomIn();
        if (a === "out") pz.zoomOut();
        if (a === "fit") { pz.resize(); pz.fit(); pz.center(); }
      });
    }

    function preparar(code) {
      var svg = code.querySelector("svg");
      var pre = code.closest("pre") || code;
      if (!svg || pre.dataset.mmdListo) return;
      pre.dataset.mmdListo = "1";
      pre.classList.add("mmd-wrap");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mmd-btn";
      btn.textContent = "Ampliar";
      btn.addEventListener("click", function () { abrir(code.querySelector("svg")); });
      pre.appendChild(btn);
    }

    // Mermaid dibuja los SVG después de cargar la página: se espera a que aparezcan.
    function revisar() { document.querySelectorAll(".language-mermaid").forEach(preparar); }
    new MutationObserver(revisar).observe(document.body, { childList: true, subtree: true });
    revisar();
  });
</script>
