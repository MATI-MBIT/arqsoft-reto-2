# Dos fuentes: Prometheus para ver la corrida en vivo, y el registro de eventos
# en PostgreSQL para ver cada falla cruzada con su salida, que es la evidencia.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
  - name: Registro de eventos
    uid: registro
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: reto2
    secureJsonData:
      password: reto2
    jsonData:
      database: reto2
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
